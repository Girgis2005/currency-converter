<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>محول العملات</title>

<!-- Makes it behave like a standalone app when added to Home Screen (iOS/Android) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="محول العملات" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='Arial'%3E%24%3C/text%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='Arial'%3E%24%3C/text%3E%3C/svg%3E" />

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(to bottom, #f8fafc, #eef2f7);
    color: #1e293b;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 100vh;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 380px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 { font-size: 20px; text-align: center; margin: 0 0 6px; }
  .status {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; color: #64748b; margin-bottom: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #facc15; }
  .dot.live { background: #22c55e; }
  .dot.error { background: #f87171; }
  .dot.loading { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .refresh-btn {
    background: none; border: none; color: #3b82f6; text-decoration: underline;
    font-size: 12px; cursor: pointer; padding: 0;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 12px 16px; margin-bottom: 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .row:focus-within { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }
  .flag { font-size: 26px; }
  .row .info { flex: 1; }
  .label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
  input {
    width: 100%; border: none; background: transparent; outline: none;
    font-size: 18px; font-weight: 600; color: #1e293b;
  }
  .symbol { color: #94a3b8; font-weight: 500; font-size: 14px; }
  .clear-btn {
    width: 100%; background: none; border: none; color: #64748b;
    font-size: 13px; padding: 10px 0; cursor: pointer;
  }
  .rates-toggle {
    border-top: 1px solid #f1f5f9; margin-top: 8px; padding-top: 14px;
  }
  .rates-toggle > button {
    background: none; border: none; color: #3b82f6; font-size: 12px; cursor: pointer; padding: 0;
  }
  .rates-panel {
    margin-top: 12px; background: #f8fafc; border-radius: 14px; padding: 12px;
    display: none;
  }
  .rates-panel.open { display: block; }
  .rates-panel label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; }
  .rates-panel input[type=number] {
    width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 8px 10px; font-size: 14px; font-weight: 400; margin-bottom: 10px;
  }
  .note { font-size: 11px; color: #94a3b8; line-height: 1.5; margin: 0; }
</style>
</head>
<body>

<div class="card">
  <h1>محول العملات</h1>
  <div class="status">
    <span id="dot" class="dot loading"></span>
    <span id="statusText">جاري تحميل الأسعار…</span>
    <button class="refresh-btn" onclick="fetchLiveRates()">تحديث</button>
  </div>

  <div class="row">
    <span class="flag">🇧🇷</span>
    <div class="info">
      <div class="label">Real برازيلي</div>
      <input id="brl" inputmode="decimal" placeholder="0" oninput="updateFrom('brl', this.value)" />
    </div>
    <span class="symbol">R$</span>
  </div>

  <div class="row">
    <span class="flag">🇪🇬</span>
    <div class="info">
      <div class="label">جنيه مصري</div>
      <input id="egp" inputmode="decimal" placeholder="0" oninput="updateFrom('egp', this.value)" />
    </div>
    <span class="symbol">ج.م</span>
  </div>

  <div class="row">
    <span class="flag">🇺🇸</span>
    <div class="info">
      <div class="label">دولار أمريكي</div>
      <input id="usd" inputmode="decimal" placeholder="0" oninput="updateFrom('usd', this.value)" />
    </div>
    <span class="symbol">$</span>
  </div>

  <button class="clear-btn" onclick="clearAll()">مسح الكل</button>

  <div class="rates-toggle">
    <button id="toggleBtn" onclick="toggleRates()">الأسعار الحالية / تعديل يدوي ▼</button>
    <div id="ratesPanel" class="rates-panel">
      <label>1 دولار = كام جنيه مصري</label>
      <input type="number" id="rateEgp" step="0.01" oninput="onManualRate()" />
      <label>1 دولار = كام ريال برازيلي</label>
      <input type="number" id="rateBrl" step="0.01" oninput="onManualRate()" />
      <p class="note">
        الأسعار دي سعر السوق العالمي الرسمي (mid-market)، مش بالضرورة سعر السوق السوداء في مصر. لو عايز تظبطها بسعر معين، عدّل الأرقام هنا يدوي.
      </p>
    </div>
  </div>
</div>

<script>
  let usdToEgp = 49.2;
  let usdToBrl = 5.15;
  const REFRESH_MS = 5 * 60 * 1000;

  function loadCache() {
    try {
      const cached = JSON.parse(localStorage.getItem('rates-cache'));
      if (cached && cached.usdToEgp && cached.usdToBrl) {
        usdToEgp = cached.usdToEgp;
        usdToBrl = cached.usdToBrl;
        document.getElementById('rateEgp').value = usdToEgp;
        document.getElementById('rateBrl').value = usdToBrl;
        setStatus('cached', 'بيانات محفوظة، جاري التحديث…');
        return true;
      }
    } catch (e) {}
    return false;
  }

  function setStatus(kind, text) {
    const dot = document.getElementById('dot');
    dot.className = 'dot ' + kind;
    document.getElementById('statusText').textContent = text;
  }

  async function fetchLiveRates() {
    setStatus('loading', 'جاري التحديث…');
    try {
      const res = await fetch('https://api.frankfurter.app/latest?from=USD&to=EGP,BRL');
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      const egp = data.rates && data.rates.EGP;
      const brl = data.rates && data.rates.BRL;
      if (!egp || !brl) throw new Error('missing rates');

      usdToEgp = egp;
      usdToBrl = brl;
      document.getElementById('rateEgp').value = egp.toFixed(2);
      document.getElementById('rateBrl').value = brl.toFixed(2);

      const now = new Date();
      localStorage.setItem('rates-cache', JSON.stringify({ usdToEgp: egp, usdToBrl: brl, ts: now.toISOString() }));
      const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      setStatus('live', 'آخر تحديث ' + timeStr);
      recalcFromLastEdited();
    } catch (e) {
      setStatus('error', 'تعذر التحديث، تأكد من الاتصال بالنت');
    }
  }

  function onManualRate() {
    usdToEgp = parseFloat(document.getElementById('rateEgp').value) || usdToEgp;
    usdToBrl = parseFloat(document.getElementById('rateBrl').value) || usdToBrl;
    recalcFromLastEdited();
  }

  let lastEdited = null;

  function formatNum(n) {
    if (!isFinite(n)) return '';
    return (Math.round(n * 100) / 100).toString();
  }

  function updateFrom(source, rawValue) {
    lastEdited = source;
    if (rawValue === '') { clearAll(); return; }
    const num = parseFloat(rawValue);
    if (isNaN(num)) return;

    let usd, brl, egp;
    if (source === 'brl') {
      brl = num; usd = brl / usdToBrl; egp = usd * usdToEgp;
    } else if (source === 'usd') {
      usd = num; brl = usd * usdToBrl; egp = usd * usdToEgp;
    } else if (source === 'egp') {
      egp = num; usd = egp / usdToEgp; brl = usd * usdToBrl;
    }

    if (source !== 'brl') document.getElementById('brl').value = formatNum(brl);
    if (source !== 'usd') document.getElementById('usd').value = formatNum(usd);
    if (source !== 'egp') document.getElementById('egp').value = formatNum(egp);
  }

  function recalcFromLastEdited() {
    if (!lastEdited) return;
    const el = document.getElementById(lastEdited);
    if (el && el.value !== '') updateFrom(lastEdited, el.value);
  }

  function clearAll() {
    document.getElementById('brl').value = '';
    document.getElementById('egp').value = '';
    document.getElementById('usd').value = '';
    lastEdited = null;
  }

  function toggleRates() {
    const panel = document.getElementById('ratesPanel');
    const btn = document.getElementById('toggleBtn');
    const open = panel.classList.toggle('open');
    btn.textContent = open ? 'إخفاء الأسعار ▲' : 'الأسعار الحالية / تعديل يدوي ▼';
  }

  // init
  loadCache();
  document.getElementById('rateEgp').value = usdToEgp;
  document.getElementById('rateBrl').value = usdToBrl;
  fetchLiveRates();
  setInterval(fetchLiveRates, REFRESH_MS);
</script>

</body>
</html>
